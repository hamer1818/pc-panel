[project]
name = "pc-panel"
version = "0.1.0"
description = "PC Panel: bilgisayar durumunu ve medya bilgisini ESP32-S3 ekran kartına gönderen servis"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.0",
    "nvidia-ml-py>=12.0",
    "dbus-fast>=2.0",
    "pyserial>=3.5",
    "pillow>=13.0.0",
]

[project.scripts]
pc-panel = "pc_panel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
