[project]
name = "pc-panel"
version = "0.1.0"
description = "PC Panel: bilgisayar durumunu ve medya bilgisini ESP32-S3 ekran kartına gönderen servis"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "psutil>=7.0",
    "nvidia-ml-py>=12.0",
    "pyserial>=3.5",
    "pillow>=13.0.0",
    # Linux: MPRIS medya, bildirim izleme, KDE kilit sorgusu (D-Bus)
    "dbus-fast>=2.0; sys_platform == 'linux'",
    # Windows: medya (GSMTC), bildirimler, ses (Core Audio), ikonlar ve sensörler (COM/WMI)
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management>=3.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=3.0; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.scripts]
pc-panel = "pc_panel.__main__:main"
pc-panel-olay = "pc_panel.olay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
