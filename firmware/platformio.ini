; PC Panel — Waveshare ESP32-S3-Touch-LCD-4.3 kart yazılımı
;
; Sürüm seti, ESP32_Display_Panel v1.0.4 içindeki examples/platformio/lvgl_v8_port örneğinin
; test edilmiş kombinasyonudur (Arduino 3.1.1 + "yüksek performans" kütüphaneleri + LVGL 8.4).
; Resmî `espressif32` platformu Arduino 3.x'i desteklemediği için pioarduino platformu kullanılıyor.
; Ayrıntı ve nedenler: ../docs/kararlar.md

[platformio]
default_envs = waveshare_43

[env:waveshare_43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    ; RGB ekranda Wi‑Fi açıkken görüntü kaymasını önleyen yüksek performanslı derleme
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
framework = arduino
board = waveshare_esp32s3_touch_lcd_43

; Kartın kalıcı adı (ttyACM numarası değişebilir; /dev/ttyACM0 başka bir cihaz!)
upload_port  = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90123287-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90123287-if00
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    https://github.com/lvgl/lvgl.git#v8.4.0
    bblanchon/ArduinoJson@7.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; LVGL
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0
    -I src
    ; Kütüphanenin hazır kart tanımı
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3
    ; Türkçe yazı tipleri (tools/fontlari_uret.sh ile üretilir, src/fonts/)
    -DPC_PANEL_TR_FONTS=1
